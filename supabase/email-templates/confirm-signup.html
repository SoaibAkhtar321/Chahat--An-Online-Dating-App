<!-- Paste into Supabase Dashboard > Authentication > Email Templates > "Confirm signup". Subject: "Your Chahat verification code" -->
<div style="font-family:Arial,sans-serif;max-width:480px;margin:auto;padding:24px;color:#1a1a1a">
  <h2 style="margin:0 0 12px">Welcome to Chahat</h2>
  <p>Enter this code in the app to verify your email:</p>
  <p style="font-size:32px;letter-spacing:6px;font-weight:bold;margin:16px 0">{{ .Token }}</p>
  <p>Prefer a link? <a href="{{ .ConfirmationURL }}">Confirm my email</a>, then return to the Chahat app to continue.</p>
  <p style="color:#777;font-size:12px">If you did not create a Chahat account, you can ignore this email.</p>
</div>
